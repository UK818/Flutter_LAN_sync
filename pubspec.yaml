name: flutter_lan_sync
description: >
  Secure offline peer-to-peer data synchronization for Flutter apps over
  local Wi-Fi, with encrypted transfers, discovery, and conflict handling.
repository: https://github.com/UK818/Flutter_LAN_sync
issue_tracker: https://github.com/UK818/Flutter_LAN_sync/issues
version: 0.1.3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.0
  flutter_secure_storage: ^10.0.0
  # Networking / server
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  http: ^1.1.0
  # Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Utilities
  uuid: ^4.0.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.0
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.5
