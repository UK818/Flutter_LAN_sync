name: flutter_lan_sync
description: >
  Production-grade offline LAN sync for Flutter apps.
  Peer-to-peer transfer of any JSON-serialisable data over Wi-Fi using
  X25519 ECDH + AES-256-GCM encryption, HMAC app-identity verification,
  UDP broadcast discovery, and a CRDT Last-Write-Wins merge strategy.
repository: https://github.com/UK818/Flutter_LAN_sync
issue_tracker: https://github.com/UK818/Flutter_LAN_sync/issues
version: 0.1.2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.0
  flutter_secure_storage: ^9.0.0
  # Networking / server
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  http: ^1.1.0
  # Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Utilities
  uuid: ^4.0.0
  device_info_plus: ^9.0.0
  package_info_plus: ^8.0.0
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.5
